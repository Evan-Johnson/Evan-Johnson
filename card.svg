<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
    <linearGradient id="langBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3572A5"/>
      <stop offset="40%" style="stop-color:#f7df1e"/>
      <stop offset="70%" style="stop-color:#3178c6"/>
      <stop offset="100%" style="stop-color:#3572A5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="12" ry="12" fill="#0d1117"/>

  <!-- Window chrome -->
  <rect width="800" height="36" rx="12" ry="12" fill="#161b22"/>
  <rect y="24" width="800" height="12" fill="#161b22"/>

  <!-- Traffic light dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>

  <!-- Window title -->
  <text x="400" y="23" fill="#8b949e" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', monospace">evan@github ~ neofetch</text>

  <!-- Divider line -->
  <line x1="390" y1="46" x2="390" y2="385" stroke="#21262d" stroke-width="1"/>

  <!-- ==================== LEFT COLUMN ==================== -->

  <!-- ASCII art: EVAN -->
  <text x="20" y="76" fill="#58a6ff" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="bold">
    <tspan x="20" dy="0">  _____   __   __   ___   _  _  </tspan>
    <tspan x="20" dy="13"> | ____| \ \ / /  / _ \ | \| | </tspan>
    <tspan x="20" dy="13"> |  _|    \ V /  | (_) || .` | </tspan>
    <tspan x="20" dy="13"> |_____| _|\_/_ _ \___/ |_|\_| </tspan>
    <tspan x="20" dy="13">         |____|                 </tspan>
  </text>

  <!-- Username line -->
  <text x="20" y="168" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#58a6ff" font-weight="bold">evan</tspan>
    <tspan fill="#8b949e">@</tspan>
    <tspan fill="#58a6ff" font-weight="bold">github</tspan>
  </text>
  <line x1="20" y1="174" x2="185" y2="174" stroke="#58a6ff" stroke-width="1"/>

  <!-- Static info fields -->
  <text x="20" y="194" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#58a6ff" font-weight="bold">OS</tspan>
    <tspan fill="#8b949e">: </tspan>
    <tspan fill="#e6edf3">Windows 11 / macOS</tspan>
  </text>
  <text x="20" y="212" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#58a6ff" font-weight="bold">Host</tspan>
    <tspan fill="#8b949e">: </tspan>
    <tspan fill="#e6edf3">Prov Inc. · Senior SWE</tspan>
  </text>
  <text x="20" y="230" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#58a6ff" font-weight="bold">Shell</tspan>
    <tspan fill="#8b949e">: </tspan>
    <tspan fill="#e6edf3">Python, FastAPI, React</tspan>
  </text>
  <text x="20" y="248" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#58a6ff" font-weight="bold">IDE</tspan>
    <tspan fill="#8b949e">: </tspan>
    <tspan fill="#e6edf3">Claude Code · VS Code</tspan>
  </text>
  <text x="20" y="266" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#58a6ff" font-weight="bold">Interests</tspan>
    <tspan fill="#8b949e">: </tspan>
    <tspan fill="#e6edf3">AI/LLM, Automation,</tspan>
  </text>
  <text x="20" y="282" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#8b949e">           </tspan>
    <tspan fill="#e6edf3">Trading Bots</tspan>
  </text>

  <!-- Color palette blocks -->
  <rect x="20" y="310" width="18" height="14" rx="2" fill="#ff5f57"/>
  <rect x="42" y="310" width="18" height="14" rx="2" fill="#febc2e"/>
  <rect x="64" y="310" width="18" height="14" rx="2" fill="#28c840"/>
  <rect x="86" y="310" width="18" height="14" rx="2" fill="#58a6ff"/>
  <rect x="108" y="310" width="18" height="14" rx="2" fill="#a371f7"/>
  <rect x="130" y="310" width="18" height="14" rx="2" fill="#39d353"/>
  <rect x="152" y="310" width="18" height="14" rx="2" fill="#e6edf3"/>
  <rect x="174" y="310" width="18" height="14" rx="2" fill="#8b949e"/>

  <!-- Updated at -->
  <text x="20" y="378" fill="#484f58" font-size="10" font-family="'JetBrains Mono', monospace">Updated: {{UPDATED_AT}}</text>

  <!-- ==================== RIGHT COLUMN ==================== -->

  <!-- Stats header -->
  <text x="408" y="62" fill="#58a6ff" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold">── GitHub Stats ─────────────────</text>

  <!-- Stats rows -->
  <text x="408" y="82" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#8b949e">  Repos     : </tspan><tspan fill="#39d353">{{REPOS}}</tspan>
  </text>
  <text x="408" y="99" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#8b949e">  Commits   : </tspan><tspan fill="#39d353">{{COMMITS}}</tspan>
  </text>
  <text x="408" y="116" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#8b949e">  Stars     : </tspan><tspan fill="#39d353">{{STARS}}</tspan>
  </text>
  <text x="408" y="133" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#8b949e">  Followers : </tspan><tspan fill="#39d353">{{FOLLOWERS}}</tspan>
  </text>
  <text x="408" y="150" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#8b949e">  Following : </tspan><tspan fill="#39d353">{{FOLLOWING}}</tspan>
  </text>
  <text x="408" y="167" font-family="'JetBrains Mono', monospace" font-size="12">
    <tspan fill="#8b949e">  LOC       : </tspan><tspan fill="#39d353">{{LOC_ADDED}}</tspan><tspan fill="#8b949e"> / </tspan><tspan fill="#f85149">{{LOC_DELETED}}</tspan>
  </text>

  <!-- Contribution grid header -->
  <text x="408" y="192" fill="#58a6ff" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold">── Contributions (12 weeks) ──────</text>

  <!-- Contribution grid placeholder - replaced by Python script -->
  {{CONTRIBUTION_GRID}}

  <!-- Languages header -->
  <text x="408" y="310" fill="#58a6ff" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold">── Top Languages ─────────────────</text>

  <!-- Language bar placeholder - replaced by Python script -->
  {{LANGUAGE_BAR}}

  <!-- Language legend placeholder -->
  {{LANGUAGE_LEGEND}}

</svg>
